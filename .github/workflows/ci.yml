name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches `requires-python = ">=3.11"` in pyproject.toml. The previous
        # workflow tested 3.9 and 3.10, which the project does not support.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (syntax and undefined names are hard failures)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=110 --statistics

      - name: Verify the package installs cleanly
        run: |
          pip install .
          python -c "import risklib; print('risklib', risklib.__version__)"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      - name: Reproduce the published validation results
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/generate_validation_results.py --check
